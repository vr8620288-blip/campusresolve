<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login · CampusResolve</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo-dot">CR</div>
      <h2>CampusResolve</h2>
      <p>Smart Campus Complaint &amp; Issue Tracking</p>
    </div>

    <div id="error-box" class="auth-error" style="display:none;"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@smartcampus.edu" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" required placeholder="Your password" />
          <button type="button" id="toggle-pw">Show</button>
        </div>
      </div>
      <div class="form-group" style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="remember" style="width:auto;" checked />
        <label for="remember" style="margin:0;">Keep me signed in</label>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Login</button>
    </form>

    <div class="auth-footer">
      New student? <a href="register.html">Create an account</a>
    </div>

    <div class="demo-creds">
      <strong>Demo accounts</strong><br/>
      Admin: admin@smartcampus.edu / Admin@123<br/>
      Staff: staff@smartcampus.edu / Staff@123<br/>
      Student: student@smartcampus.edu / Student@123
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  document.getElementById("toggle-pw").addEventListener("click", () => {
    const pw = document.getElementById("password");
    const btn = document.getElementById("toggle-pw");
    if (pw.type === "password") { pw.type = "text"; btn.textContent = "Hide"; }
    else { pw.type = "password"; btn.textContent = "Show"; }
  });

  if (Session.isLoggedIn()) window.location.href = "dashboard.html";

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("error-box");
    const submitBtn = document.getElementById("submit-btn");
    errorBox.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in…";
    try {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const data = await Api.login({ email, password });
      Session.save(data.access_token, data.role, data.full_name);
      window.location.href = "dashboard.html";
    } catch (err) {
      errorBox.textContent = err.message || "Login failed. Please check your credentials.";
      errorBox.style.display = "block";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Login";
    }
  });
</script>
</body>
</html>
