<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · CampusResolve</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
  Session.requireRole("ADMIN");
  const content = renderShell({ title: "Admin", activeHref: "admin.html" });
  const tab = new URLSearchParams(window.location.search).get("tab") || "complaints";

  content.innerHTML = `
    <div class="toolbar" style="margin-bottom:18px;">
      <a class="btn ${tab === "complaints" ? "btn-primary" : "btn-outline"} btn-sm" href="admin.html?tab=complaints">All Complaints</a>
      <a class="btn ${tab === "users" ? "btn-primary" : "btn-outline"} btn-sm" href="admin.html?tab=users">Users &amp; Staff</a>
      <a class="btn ${tab === "catalog" ? "btn-primary" : "btn-outline"} btn-sm" href="admin.html?tab=catalog">Categories &amp; Departments</a>
    </div>
    <div id="tab-root"></div>
  `;
  const tabRoot = document.getElementById("tab-root");

  // ================= COMPLAINTS TAB =================
  async function renderComplaintsTab() {
    tabRoot.innerHTML = `
      <div class="toolbar">
        <input type="text" id="search" placeholder="Search by title, ref, location, student…" />
        <select id="status-filter">
          <option value="">All Statuses</option>
          <option value="SUBMITTED">Submitted</option>
          <option value="ASSIGNED">Assigned</option>
          <option value="IN_PROGRESS">In Progress</option>
          <option value="RESOLVED">Resolved</option>
          <option value="CLOSED">Closed</option>
          <option value="REOPENED">Reopened</option>
        </select>
        <select id="priority-filter">
          <option value="">All Priorities</option>
          <option value="LOW">Low</option>
          <option value="MEDIUM">Medium</option>
          <option value="HIGH">High</option>
          <option value="CRITICAL">Critical</option>
        </select>
        <select id="sort">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="priority">Highest priority</option>
          <option value="updated">Recently updated</option>
        </select>
      </div>
      <div class="card"><div id="list-root" class="loading-state"><div class="spinner"></div>Loading…</div></div>
    `;

    async function loadList() {
      const root = document.getElementById("list-root");
      root.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading…</div>';
      try {
        const params = {
          search: document.getElementById("search").value.trim(),
          status: document.getElementById("status-filter").value,
          priority: document.getElementById("priority-filter").value,
          sort: document.getElementById("sort").value,
          page_size: 100,
        };
        const data = await Api.listComplaints(params);
        if (!data.items.length) {
          root.innerHTML = '<div class="empty-state">No complaints found.</div>';
          return;
        }
        root.innerHTML = `
          <div class="table-wrap">
          <table>
            <thead><tr><th>Ref</th><th>Title</th><th>Student</th><th>Staff</th><th>Priority</th><th>Status</th><th>Date</th></tr></thead>
            <tbody>
              ${data.items
                .map(
                  (c) => `
                <tr class="clickable" onclick="window.location.href='complaint-details.html?id=${c.id}'">
                  <td>${c.reference_code}</td>
                  <td>${escapeHtml(c.title)}</td>
                  <td>${escapeHtml(c.student_name || "-")}</td>
                  <td>${escapeHtml(c.assigned_staff_name || "Unassigned")}</td>
                  <td><span class="badge badge-${c.priority}">${c.priority}</span></td>
                  <td><span class="badge badge-${c.status}">${statusLabel(c.status)}</span>${c.is_overdue ? ' <span class="badge badge-overdue">Overdue</span>' : ""}</td>
                  <td>${formatDate(c.created_at)}</td>
                </tr>`
                )
                .join("")}
            </tbody>
          </table>
          </div>`;
      } catch (err) {
        root.innerHTML = `<div class="error-state">${escapeHtml(err.message)}</div>`;
      }
    }
    ["search", "status-filter", "priority-filter", "sort"].forEach((id) =>
      document.getElementById(id).addEventListener("change", loadList)
    );
    document.getElementById("search").addEventListener("keyup", (e) => { if (e.key === "Enter") loadList(); });
    loadList();
  }

  // ================= USERS TAB =================
  async function renderUsersTab() {
    tabRoot.innerHTML = `
      <div class="grid grid-2">
        <div class="card">
          <div class="section-title" style="margin-top:0;">Create Staff Account</div>
          <div id="staff-error" class="auth-error" style="display:none;"></div>
          <div class="form-group"><label>Full Name</label><input id="s-name" /></div>
          <div class="form-group"><label>Email</label><input id="s-email" type="email" /></div>
          <div class="form-group"><label>Phone</label><input id="s-phone" /></div>
          <div class="form-group"><label>Department</label><select id="s-dept"></select></div>
          <div class="form-group"><label>Temporary Password</label><input id="s-password" type="text" value="Staff@123" /></div>
          <button class="btn btn-primary" id="create-staff-btn">Create Staff Account</button>
        </div>
        <div class="card">
          <div class="section-title" style="margin-top:0;">All Users</div>
          <div id="users-list" class="loading-state"><div class="spinner"></div>Loading…</div>
        </div>
      </div>
    `;

    const depts = await Api.listDepartments().catch(() => []);
    const deptSel = document.getElementById("s-dept");
    deptSel.innerHTML = '<option value="">No department</option>' + depts.map((d) => `<option value="${d.id}">${escapeHtml(d.name)}</option>`).join("");

    async function loadUsers() {
      const root = document.getElementById("users-list");
      try {
        const users = await Api.listUsers();
        root.innerHTML = `
          <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead>
            <tbody>
              ${users
                .map(
                  (u) => `
                <tr>
                  <td>${escapeHtml(u.full_name)}</td>
                  <td>${escapeHtml(u.email)}</td>
                  <td>${u.role}</td>
                  <td>${u.is_active ? "Active" : "Deactivated"}</td>
                  <td>
                    ${
                      u.role !== "ADMIN"
                        ? u.is_active
                          ? `<button class="btn btn-outline btn-sm" data-deactivate="${u.id}">Deactivate</button>`
                          : `<button class="btn btn-secondary btn-sm" data-activate="${u.id}">Activate</button>`
                        : ""
                    }
                  </td>
                </tr>`
                )
                .join("")}
            </tbody>
          </table>
          </div>`;
        root.querySelectorAll("[data-deactivate]").forEach((btn) =>
          btn.addEventListener("click", async () => {
            await Api.deactivateUser(btn.getAttribute("data-deactivate"));
            toast("User deactivated", "success");
            loadUsers();
          })
        );
        root.querySelectorAll("[data-activate]").forEach((btn) =>
          btn.addEventListener("click", async () => {
            await Api.activateUser(btn.getAttribute("data-activate"));
            toast("User activated", "success");
            loadUsers();
          })
        );
      } catch (err) {
        root.innerHTML = `<div class="error-state">${escapeHtml(err.message)}</div>`;
      }
    }
    loadUsers();

    document.getElementById("create-staff-btn").addEventListener("click", async () => {
      const errBox = document.getElementById("staff-error");
      errBox.style.display = "none";
      try {
        await Api.createStaff({
          full_name: document.getElementById("s-name").value.trim(),
          email: document.getElementById("s-email").value.trim(),
          phone: document.getElementById("s-phone").value.trim() || null,
          department_id: document.getElementById("s-dept").value ? parseInt(document.getElementById("s-dept").value, 10) : null,
          password: document.getElementById("s-password").value,
        });
        toast("Staff account created", "success");
        ["s-name", "s-email", "s-phone"].forEach((id) => (document.getElementById(id).value = ""));
        loadUsers();
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = "block";
      }
    });
  }

  // ================= CATALOG TAB =================
  async function renderCatalogTab() {
    tabRoot.innerHTML = `
      <div class="grid grid-2">
        <div class="card">
          <div class="section-title" style="margin-top:0;">Categories</div>
          <div class="form-group" style="display:flex; gap:8px;">
            <input id="new-category" placeholder="New category name" />
            <button class="btn btn-primary btn-sm" id="add-category-btn">Add</button>
          </div>
          <div id="categories-list" class="loading-state"><div class="spinner"></div>Loading…</div>
        </div>
        <div class="card">
          <div class="section-title" style="margin-top:0;">Departments</div>
          <div class="form-group" style="display:flex; gap:8px;">
            <input id="new-department" placeholder="New department name" />
            <button class="btn btn-primary btn-sm" id="add-department-btn">Add</button>
          </div>
          <div id="departments-list" class="loading-state"><div class="spinner"></div>Loading…</div>
        </div>
      </div>
    `;

    async function loadCategories() {
      const root = document.getElementById("categories-list");
      const cats = await Api.listCategories();
      root.innerHTML = cats
        .map(
          (c) =>
            `<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border);"><span>${escapeHtml(c.name)}</span><span style="color:var(--text-muted); font-size:0.8rem;">${c.is_active ? "Active" : "Inactive"}</span></div>`
        )
        .join("") || '<div class="empty-state">No categories yet.</div>';
    }
    async function loadDepartments() {
      const root = document.getElementById("departments-list");
      const depts = await Api.listDepartments();
      root.innerHTML = depts
        .map(
          (d) =>
            `<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border);"><span>${escapeHtml(d.name)}</span><span style="color:var(--text-muted); font-size:0.8rem;">${d.is_active ? "Active" : "Inactive"}</span></div>`
        )
        .join("") || '<div class="empty-state">No departments yet.</div>';
    }
    loadCategories();
    loadDepartments();

    document.getElementById("add-category-btn").addEventListener("click", async () => {
      const name = document.getElementById("new-category").value.trim();
      if (!name) return;
      try {
        await Api.createCategory({ name });
        document.getElementById("new-category").value = "";
        toast("Category added", "success");
        loadCategories();
      } catch (err) { toast(err.message, "error"); }
    });
    document.getElementById("add-department-btn").addEventListener("click", async () => {
      const name = document.getElementById("new-department").value.trim();
      if (!name) return;
      try {
        await Api.createDepartment({ name });
        document.getElementById("new-department").value = "";
        toast("Department added", "success");
        loadDepartments();
      } catch (err) { toast(err.message, "error"); }
    });
  }

  if (tab === "users") renderUsersTab();
  else if (tab === "catalog") renderCatalogTab();
  else renderComplaintsTab();
</script>
</body>
</html>
